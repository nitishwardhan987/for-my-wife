<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Apology Wheel</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #faf7f0;
            font-family: 'Lato', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; color: #1b264f;
            overflow-x: hidden;
        }
        .game-header {
            text-align: center;
            padding: 20px;
            margin-bottom: 10px;
        }
        h2 { font-family: 'Playfair Display', serif; color: #e02f5e; font-size: 2.5em; margin-bottom: 5px; }
        p { font-size: 1.1em; color: #555; max-width: 400px; margin: 0 auto; }

        /* Wheel Container */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px auto;
        }
        
        /* The Pointer */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #1b264f;
            z-index: 10;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            transform: rotate(0deg);
        }

        /* Controls & Results */
        .controls {
            text-align: center;
            margin-top: 30px;
            z-index: 10;
        }
        .btn {
            background-color: #e02f5e; color: white; border: none;
            padding: 15px 40px; border-radius: 30px; font-size: 1.2em;
            cursor: pointer; font-weight: bold; font-family: 'Lato', sans-serif;
            box-shadow: 0 4px 15px rgba(224, 47, 94, 0.3);
            transition: transform 0.2s, background 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }
        
        .btn-back {
            background-color: transparent;
            color: #1b264f;
            border: 2px solid #1b264f;
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 1em;
            box-shadow: none;
        }

        #result-display {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
            color: #e02f5e;
            font-family: 'Playfair Display', serif;
            min-height: 2em;
            padding: 0 20px;
            text-align: center;
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            background-color: #f00;
            z-index: 100;
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="game-header">
        <h2>Spin For Justice ⚖️</h2>
        <p>I lost the argument. You get to spin the wheel to determine my official punishment (your prize).</p>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
    </div>

    <div id="result-display"></div>

    <div class="controls">
        <button class="btn" id="spin-btn" onclick="spinWheel()">SPIN THE WHEEL</button><br>
        <!-- The Back Button now cleverly remembers EXACTLY which page she came from -->
        <button class="btn btn-back" onclick="goBackToAlbum()">← Go Back to Album</button>
    </div>

    <script>
        // Wheel Logic
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spin-btn");
        const resultDisplay = document.getElementById("result-display");

        // The specific prizes on the wheel
        const prizes = [
            "Unlimited Foot Massages",
            "Dinner in JP Nagar (My Treat)",
            "I Do The Dishes For A Week",
            "You Get 100% TV Remote Control",
            "Shopping Spree (Blank Check)",
            "I Admit You Are 100% Right"
        ];
        
        const colors = ["#e02f5e", "#1b264f", "#b8892b", "#5b6b4f", "#e0687a", "#2b2118"];
        const numSlices = prizes.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        let currentRotation = 0;

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX;

            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i];
                ctx.fill();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 26px Lato";
                
                // Add text and align it inside the slice
                ctx.fillText(prizes[i], radius - 30, 10);
                ctx.restore();
            }
        }

        function spinWheel() {
            spinBtn.disabled = true;
            resultDisplay.innerText = "Spinning...";

            // Random extra spins + a random stop point
            const extraSpins = Math.floor(Math.random() * 3) + 4; // 4 to 6 full rotations
            const randomDegree = Math.floor(Math.random() * 360);
            const totalRotation = (extraSpins * 360) + randomDegree;
            
            currentRotation += totalRotation;

            // Apply rotation via CSS for smooth easing
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Wait for CSS transition to finish (4 seconds)
            setTimeout(() => {
                // Calculate which slice is at the top (Pointer is at 270 degrees visually, but logic needs offset)
                const actualRotation = currentRotation % 360;
                // Offset because standard canvas 0 starts at the right (3 o'clock), but pointer is at top (12 o'clock)
                const pointerAngle = (360 - actualRotation + 270) % 360;
                
                const winningIndex = Math.floor(pointerAngle / (360 / numSlices));
                const winningPrize = prizes[winningIndex];

                resultDisplay.innerText = "🎉 You Won: " + winningPrize + "!";
                fireConfetti();
                spinBtn.innerText = "SPIN AGAIN?";
                spinBtn.disabled = false;
            }, 4000);
        }

        // Fun Confetti Effect for when she wins
        function fireConfetti() {
            for (let i = 0; i < 50; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                document.body.appendChild(conf);
                
                // Random position and color
                conf.style.left = Math.random() * window.innerWidth + 'px';
                conf.style.top = (window.innerHeight / 2) + 'px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Animate
                let angle = Math.random() * Math.PI * 2;
                let velocity = 5 + Math.random() * 15;
                let x = parseFloat(conf.style.left);
                let y = parseFloat(conf.style.top);
                
                let fall = setInterval(() => {
                    x += Math.cos(angle) * velocity;
                    y += Math.sin(angle) * velocity + 2; // + gravity
                    conf.style.left = x + 'px';
                    conf.style.top = y + 'px';
                    conf.style.opacity = 1;
                    
                    if (y > window.innerHeight) {
                        clearInterval(fall);
                        conf.remove();
                    }
                }, 20);
            }
        }

        // Smart Navigation: Takes her back to the exact version she was viewing
        function goBackToAlbum() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback just in case she opened the game link directly
                window.location.href = 'index.html';
            }
        }

        // Initialize the wheel
        drawWheel();
    </script>
</body>
</html>
