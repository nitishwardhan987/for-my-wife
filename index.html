<!-- INTERACTIVE TRUCE SECTION -->
    <section id="share-section" data-animate>
        <h3>Do I get a second chance?</h3>
        <p class="caption" style="margin-bottom: 20px;">Please select your answer carefully.</p>
        
        <div class="share-buttons" style="position: relative; height: 100px; margin-top: 30px;">
            <button id="btn-yes" class="share-btn share-whatsapp" style="font-size: 1.2em; padding: 15px 40px; z-index: 10;">
                <span>❤️ Yes, I forgive you</span>
            </button>
            <button id="btn-no" class="share-btn share-copy" style="font-size: 1.2em; padding: 15px 40px; position: absolute; left: 50%; margin-left: 100px; z-index: 5;">
                <span>No</span>
            </button>
        </div>

        <div style="margin-top: 50px;">
            <p class="caption-joke">Still not convinced?</p>
            <a href="game.html" class="share-btn" style="background-color: var(--navy); margin-top: 10px;">
                <span>🛵 Let me prove it in a game</span>
            </a>
        </div>
    </section>

    <!-- HIDDEN AUDIO PLAYER (Add your own romantic/funny mp3 link if you want) -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- FOOTER -->
    <footer>
        <p>I Love You. <span class="heart">❤️</span> From Your Apologetic Husband.</p>
    </footer>

    <script>
        // 1. Scroll Animations
        const observerOptions = { root: null, threshold: 0.15, rootMargin: '0px' };
        const animationObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate-visible');
                    observer.unobserve(entry.target); 
                }
            });
        }, observerOptions);
        document.querySelectorAll('[data-animate]').forEach(el => animationObserver.observe(el));

        // 2. Play Audio on First Scroll/Touch (Browsers require interaction to play audio)
        let audioPlayed = false;
        window.addEventListener('scroll', () => {
            if (!audioPlayed) {
                document.getElementById('bg-music').volume = 0.2;
                document.getElementById('bg-music').play().catch(e => console.log("Audio autoplay blocked"));
                audioPlayed = true;
            }
        });

        // 3. The Unclickable "No" Button
        const noBtn = document.getElementById('btn-no');
        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents her from tapping it on mobile!
            moveButton();
        });

        // 4. The Instant Notification Webhook
        const yesBtn = document.getElementById('btn-yes');
        yesBtn.addEventListener('click', () => {
            yesBtn.innerHTML = "<span>🎉 YAY! Incoming Hugs! 🎉</span>";
            
            // Pop your n8n webhook URL right here to ping your WhatsApp!
            const webhookUrl = "YOUR_N8N_WEBHOOK_URL_HERE"; 
            
            fetch(webhookUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "She said YES! Truce accepted!" })
            }).catch(err => console.log("Webhook fired"));
        });
    </script>
</body>
</html>
